name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          JEKYLL_ENV: production
          # Serves the site correctly from /<repo>/ rather than the domain root.
          PAGES_REPO_NWO: ${{ github.repository }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Origin only (https://owner.github.io); jekyll-seo-tag joins it with
          # baseurl to emit absolute canonical URLs.
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          # `url` has no CLI equivalent - Jekyll accepts it only from a config
          # file - so it is layered in from a generated overlay.
          printf 'url: %s\n' "$SITE_ORIGIN" > _config.pages.yml
          bundle exec jekyll build \
            --config _config.yml,_config.pages.yml \
            --baseurl "$BASE_PATH" \
            --destination ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
